<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="1000" height="1200">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE8EC" />
      <stop offset="50%" stop-color="#FFF3E4" />
      <stop offset="100%" stop-color="#FED7DC" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63956" />
      <stop offset="100%" stop-color="#C2185B" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#8C1D2F" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1200" fill="url(#bgGrad1)" />

  <!-- Decorative circles -->
  <circle cx="200" cy="200" r="160" fill="#FFF9F2" opacity="0.6" />
  <circle cx="850" cy="300" r="220" fill="#FFE8EC" opacity="0.8" />
  <circle cx="150" cy="950" r="200" fill="#FFE4E8" opacity="0.7" />

  <!-- Main Card -->
  <rect x="100" y="140" width="800" height="920" rx="40" fill="#FFFFFF" filter="url(#softShadow)" />

  <!-- Border Frame -->
  <rect x="120" y="160" width="760" height="880" rx="30" fill="none" stroke="#F8B4C0" stroke-width="3" stroke-dasharray="10 8" />

  <!-- Illustration Group: Mother & Family Warmth -->
  <g transform="translate(500, 480)">
    <!-- Sun/Warm aura -->
    <circle cx="0" cy="0" r="180" fill="#FFF2DE" />
    <circle cx="0" cy="0" r="140" fill="#FFE3EA" />

    <!-- Big Center Heart -->
    <path d="M 0,90 C -120,-20 -150,-130 -60,-170 C -10,-190 0,-120 0,-120 C 0,-120 10,-190 60,-170 C 150,-130 120,-20 0,90 Z" 
          fill="url(#heartGrad)" filter="url(#softShadow)" />

    <!-- Smaller hearts floating -->
    <path d="M -130,-120 C -170,-160 -190,-210 -140,-230 C -110,-240 -130,-200 -130,-200 C -130,-200 -120,-240 -90,-230 C -40,-210 -70,-160 -130,-120 Z" 
          fill="#FF6B8B" opacity="0.7" transform="scale(0.5) translate(-100, -80)" />
    <path d="M 130,-120 C 90,-160 70,-210 120,-230 C 150,-240 130,-200 130,-200 C 130,-200 140,-240 170,-230 C 220,-210 190,-160 130,-120 Z" 
          fill="#FF85A1" opacity="0.7" transform="scale(0.5) translate(120, -80)" />

    <!-- Flowers -->
    <g transform="translate(-160, 120)">
      <circle cx="0" cy="0" r="28" fill="#FFCCD5" />
      <circle cx="-18" cy="-18" r="18" fill="#FF85A1" />
      <circle cx="18" cy="-18" r="18" fill="#FF85A1" />
      <circle cx="-18" cy="18" r="18" fill="#FF85A1" />
      <circle cx="18" cy="18" r="18" fill="#FF85A1" />
      <circle cx="0" cy="0" r="12" fill="#FFD166" />
    </g>
    <g transform="translate(160, 120)">
      <circle cx="0" cy="0" r="28" fill="#FFCCD5" />
      <circle cx="-18" cy="-18" r="18" fill="#FF85A1" />
      <circle cx="18" cy="-18" r="18" fill="#FF85A1" />
      <circle cx="-18" cy="18" r="18" fill="#FF85A1" />
      <circle cx="18" cy="18" r="18" fill="#FF85A1" />
      <circle cx="0" cy="0" r="12" fill="#FFD166" />
    </g>
  </g>

  <!-- Title & Typography -->
  <text x="500" y="780" font-family="'Playfair Display', serif, sans-serif" font-size="44" font-weight="bold" fill="#8C1D2F" text-anchor="middle">
    Gia Đình Hạnh Phúc
  </text>
  <text x="500" y="840" font-family="'Be Vietnam Pro', sans-serif" font-size="28" fill="#6A3B43" text-anchor="middle">
    Nụ cười của Mẹ thắp sáng tổ ấm của chúng con
  </text>
  <text x="500" y="900" font-family="'Be Vietnam Pro', sans-serif" font-size="22" font-style="italic" fill="#99626A" text-anchor="middle">
    (Ảnh mẫu minh họa - Hãy thay bằng ảnh thật của gia đình)
  </text>
  <text x="500" y="990" font-family="'Be Vietnam Pro', sans-serif" font-size="20" fill="#B38088" text-anchor="middle">
    Mừng Ngày 20/10 Yêu Thương 💐
  </text>
</svg>
