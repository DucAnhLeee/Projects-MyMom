<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="1000" height="1200">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E6" />
      <stop offset="60%" stop-color="#FFEED9" />
      <stop offset="100%" stop-color="#FEDCBD" />
    </linearGradient>
    <filter id="softShadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#A75D00" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="1000" height="1200" fill="url(#bgGrad3)" />

  <circle cx="850" cy="200" r="180" fill="#FFFDF5" opacity="0.8" />
  <circle cx="150" cy="250" r="160" fill="#FFEAC2" opacity="0.6" />
  <circle cx="200" cy="1000" r="220" fill="#FFE5BD" opacity="0.7" />

  <!-- Main Card -->
  <rect x="100" y="140" width="800" height="920" rx="40" fill="#FFFFFF" filter="url(#softShadow3)" />
  <rect x="120" y="160" width="760" height="880" rx="30" fill="none" stroke="#E6A15C" stroke-width="3" stroke-dasharray="10 8" />

  <!-- Center Graphic: Warm Teacup & Home Hearth -->
  <g transform="translate(500, 470)">
    <circle cx="0" cy="0" r="170" fill="#FFF8EE" stroke="#FCE2C4" stroke-width="4" />

    <!-- Teacup/Bowl of Warmth -->
    <path d="M -90,-20 C -90,70 90,70 90,-20 Z" fill="#E27344" />
    <path d="M -100,-20 C -100,-35 100,-35 100,-20 C 100,-5 -100,-5 -100,-20 Z" fill="#FF9A68" />
    <path d="M 85,-5 C 115,-5 120,40 85,45" fill="none" stroke="#E27344" stroke-width="14" stroke-linecap="round" />
    <ellipse cx="0" cy="65" rx="100" ry="14" fill="#D36030" opacity="0.4" />

    <!-- Steam Hearts -->
    <path d="M -30,-60 C -45,-90 -15,-110 -30,-140" fill="none" stroke="#FF8C5A" stroke-width="7" stroke-linecap="round" opacity="0.8" />
    <path d="M 20,-60 C 5,-90 35,-110 20,-140" fill="none" stroke="#FF8C5A" stroke-width="7" stroke-linecap="round" opacity="0.8" />
    <path d="M 0,-155 C -8,-170 -20,-170 -20,-158 C -20,-150 -8,-142 0,-134 C 8,-142 20,-150 20,-158 C 20,-170 8,-170 0,-155 Z" fill="#E24B66" />
  </g>

  <!-- Title & Typography -->
  <text x="500" y="780" font-family="'Playfair Display', serif, sans-serif" font-size="44" font-weight="bold" fill="#8C3A1D" text-anchor="middle">
    Kỷ Niệm Ấm Áp
  </text>
  <text x="500" y="840" font-family="'Be Vietnam Pro', sans-serif" font-size="28" fill="#6B3A28" text-anchor="middle">
    Từng bữa cơm ngon, từng tách trà thơm Mẹ nấu
  </text>
  <text x="500" y="900" font-family="'Be Vietnam Pro', sans-serif" font-size="22" font-style="italic" fill="#99604E" text-anchor="middle">
    (Ảnh mẫu minh họa - Hãy tải ảnh sum vầy gia đình lên)
  </text>
  <text x="500" y="990" font-family="'Be Vietnam Pro', sans-serif" font-size="20" fill="#B37C6D" text-anchor="middle">
    Ấm Áp Gia Đình Ta 🍵
  </text>
</svg>
