name: Deploy 20-10 Gift to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Quyền hạn cần thiết để deploy lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ cho phép một deployment diễn ra tại một thời điểm
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tự động quét và cập nhật danh sách ảnh
        run: node scripts/generate-photos.js

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Đóng gói trang web
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Triển khai lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
